<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI for Creativity Deck</title>
</head>
<body>
<script>
// Reuse the exact card experience used by the other decks. Only the content changes.
(async () => {
  try {
    const response = await fetch('card2.html');
    if (!response.ok) throw new Error(`Shared deck returned ${response.status}`);
    let html = await response.text();
    const scripts = '<script src="macro-lens-cards.js"><\/script>';
    const branch = "}:deckKey==='macro-lens'?{";
    if (!html.includes(scripts) || !html.includes(branch)) throw new Error('Shared deck structure has changed');
    html = html.replace(scripts, '<script src="ai-for-creativity-cards.js"><\/script>\n' + scripts);
    html = html.replace(branch, `}:deckKey==='ai-for-creativity'?{
  title:'AI for Creativity',
  cards:window.aiForCreativityCards
` + branch);
    history.replaceState(null, '', 'ai-for-creativity.html?deck=ai-for-creativity');
    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    document.body.textContent = 'Could not load AI for Creativity. Please refresh the page.';
    console.error('AI for Creativity deck:', error);
  }
})();
</script>
</body>
</html>
