name: Add Apple UI Mastery homepage entry
on:
  push:
    paths:
      - '.github/workflows/add-ui-mastery-entry.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Add matching homepage tile and check content
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          page = Path('index.html')
          html = page.read_text()
          if 'href="apple-ui-mastery.html"' not in html:
              marker = '<a class="deck" href="macro-lens.html">'
              assert marker in html, 'Existing deck selector was not found'
              pos = html.index('</a></section>', html.index(marker)) + len('</a>')
              entry = '<a class="deck" href="apple-ui-mastery.html"><div class="deck-title"><h2>Apple UI Mastery</h2><button class="deck-info" type="button" aria-label="About Apple UI Mastery" data-info="appleUIMastery">i</button></div></a>'
              html = html[:pos] + entry + html[pos:]
          if 'appleUIMastery:{title:' not in html:
              marker = '};\nfunction closeInfo()'
              assert marker in html, 'Existing deck information lookup was not found'
              insert = ',appleUIMastery:{title:"Apple UI Mastery",body:"A 150-card independent learning deck for Apple UI terminology, components, navigation, inputs, platform conventions and accessibility. Uses the same card experience as all other decks, with original explanations and practice prompts based on the Apple Human Interface Guidelines."}'
              html = html.replace(marker, insert + marker, 1)
          assert html.count('href="apple-ui-mastery.html"') == 1
          assert 'data-info="appleUIMastery"' in html
          page.write_text(html)
          PY
          node --check apple-ui-mastery-cards.js
          make check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Add Apple UI Mastery to deck selector'
            git push
          fi
