name: Apply random card start
on:
  push:
    paths:
      - '.github/workflows/apply-random-start.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch shared deck engine
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('card2.html')
          s = p.read_text()
          old = "let s={...defaults},current=0,dragging=false,pointerId=null,moved=false,settling=false;"
          new = "let s={...defaults},current=Math.floor(Math.random()*cards.length),dragging=false,pointerId=null,moved=false,settling=false;"
          if old not in s:
              raise SystemExit('Expected current=0 initialization not found')
          p.write_text(s.replace(old, new, 1))
          Path('.github/workflows/apply-random-start.yml').unlink()
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add card2.html .github/workflows/apply-random-start.yml
          git commit -m "Start every deck on a random card"
          git push
