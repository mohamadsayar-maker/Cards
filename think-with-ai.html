<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<title>Think With AI, 52 Cards</title>
<style>
:root{--bg:#090909;--panel:#151515;--line:#303030;--text:#f5f3ee;--muted:#aaa69d;--accent:#f1efea;--suit:#ff5d67;--shadow:0 28px 80px rgba(0,0,0,.48)}
*{box-sizing:border-box}html,body{min-height:100%;margin:0;background:radial-gradient(circle at 50% 0,#202020 0,#0d0d0d 37%,#070707 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,a{font:inherit}.app{min-height:100vh;display:flex;flex-direction:column;padding:max(20px,env(safe-area-inset-top)) clamp(16px,3vw,44px) max(20px,env(safe-area-inset-bottom))}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px}.back,.utility{border:1px solid var(--line);background:rgba(20,20,20,.72);color:var(--text);text-decoration:none;border-radius:999px;padding:10px 14px;cursor:pointer;backdrop-filter:blur(15px)}.back:hover,.utility:hover,.filter:hover{border-color:#696969}.intro{text-align:center;margin:clamp(28px,5vh,62px) auto 18px;max-width:760px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.18em;color:var(--muted)}h1{font-size:clamp(36px,7vw,76px);letter-spacing:-.055em;line-height:.95;margin:12px 0 16px}.intro p{color:var(--muted);font-size:clamp(15px,2vw,19px);margin:0 auto;max-width:620px}.filters{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:18px auto 14px}.filter{border:1px solid var(--line);background:#141414;color:var(--muted);padding:9px 13px;border-radius:999px;cursor:pointer;transition:.2s}.filter.active{background:var(--text);color:#0b0b0b;border-color:var(--text)}.stage{flex:1;display:grid;place-items:center;min-height:520px;perspective:1600px}.card-wrap{width:min(430px,88vw);aspect-ratio:2.65/3.75;position:relative}.card{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.75,.25,1);cursor:pointer;filter:drop-shadow(var(--shadow));outline:none}.card.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;border-radius:28px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;border:1px solid rgba(255,255,255,.17);background:linear-gradient(150deg,#f8f6f0,#eae6db);color:#121212;padding:24px;display:flex;flex-direction:column}.face:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 15% 8%,rgba(255,255,255,.9),transparent 34%),linear-gradient(135deg,transparent 40%,rgba(0,0,0,.045));pointer-events:none}.front{justify-content:space-between}.backface{transform:rotateY(180deg);background:linear-gradient(155deg,#171717,#0b0b0b);color:#f6f3ed;overflow:auto}.corner{display:flex;flex-direction:column;align-items:flex-start;font-weight:750;font-size:26px;line-height:.85;position:relative;z-index:1}.corner.bottom{align-self:flex-end;transform:rotate(180deg)}.symbol{color:var(--suit);font-size:30px;margin-top:6px}.front-main{text-align:center;position:relative;z-index:1;margin:auto 0}.category{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#6e6a63;margin-bottom:16px}.front h2{font-size:clamp(34px,8vw,52px);letter-spacing:-.05em;line-height:.94;margin:0}.front .hint{font-size:12px;color:#777168;margin-top:18px}.back-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;position:relative;z-index:1}.back-title{font-size:27px;letter-spacing:-.035em;line-height:1;margin:0}.badge{color:var(--suit);font-weight:750;font-size:24px}.sections{position:relative;z-index:1;margin-top:22px;display:grid;gap:16px}.section{border-top:1px solid #353535;padding-top:13px}.label{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:#8d8981;margin-bottom:7px}.section p{font-size:14px;line-height:1.48;margin:0}.prompt{font-size:15px!important;color:#fff}.copy{margin-top:auto;position:relative;z-index:1;border:1px solid #474747;background:#232323;color:#fff;padding:11px 14px;border-radius:12px;cursor:pointer}.copy:hover{background:#2d2d2d}.controls{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px}.control{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:#141414;color:#fff;cursor:pointer;font-size:20px}.control.random{width:auto;border-radius:999px;padding:0 18px;font-size:14px}.control:hover{border-color:#777}.meta{text-align:center;color:var(--muted);font-size:12px;margin-top:12px;min-height:18px}.footer{text-align:center;color:#706d67;font-size:11px;margin-top:18px}.heart{--suit:#e54255}.diamond{--suit:#e35043}.club{--suit:#303030}.spade{--suit:#151515}.backface.heart,.backface.diamond,.backface.club,.backface.spade{--suit:#ff6972}@media(max-width:600px){.app{padding-left:14px;padding-right:14px}.topbar .utility{display:none}.intro{margin-top:28px}.stage{min-height:500px}.face{padding:20px;border-radius:24px}.sections{gap:12px}.section{padding-top:10px}.section p{font-size:13px}.back-title{font-size:24px}}@media(prefers-reduced-motion:reduce){.card,.filter{transition:none}}
</style>
</head>
<body>
<main class="app">
  <div class="topbar"><a class="back" href="index.html">← Decks</a><button class="utility" id="flipTop">Flip card</button></div>
  <header class="intro"><div class="eyebrow">52 practical thinking prompts</div><h1>Think With AI</h1><p>Use AI to generate ideas, design better experiences, work with more clarity, and make everyday decisions.</p></header>
  <nav class="filters" aria-label="Filter by suit">
    <button class="filter active" data-filter="all">All 52</button><button class="filter" data-filter="heart">♥ Creativity</button><button class="filter" data-filter="diamond">♦ Design</button><button class="filter" data-filter="club">♣ Work</button><button class="filter" data-filter="spade">♠ Decisions</button>
  </nav>
  <section class="stage">
    <div class="card-wrap"><article class="card" id="card" tabindex="0" aria-label="Card, press Enter to flip"><div class="face front" id="front"></div><div class="face backface" id="back"></div></article></div>
  </section>
  <div class="controls"><button class="control" id="prev" aria-label="Previous card">←</button><button class="control random" id="random">Random card</button><button class="control" id="next" aria-label="Next card">→</button></div>
  <div class="meta" id="meta"></div><div class="footer">Tap a card to flip, use arrow keys to browse</div>
</main>
<script>
const cards=[
{r:'A',s:'heart',c:'Creativity',t:'First Spark',u:`You need a starting point but the page feels blank.`,a:`Give me 20 unexpected AI-assisted ideas for [goal]. Make them varied, specific, and not obvious.`,x:`Pick the 3 ideas with the strongest emotional pull, then ask AI to expand each into a rough concept.`},
{r:'2',s:'heart',c:'Creativity',t:'Bad Ideas First',u:`You are stuck because the work feels too important, serious, or polished too early.`,a:`Give me 15 deliberately bad ideas for [challenge], then extract the useful principles hidden inside them.`,x:`Choose one bad idea and reverse it into something useful, surprising, or commercially viable.`},
{r:'3',s:'heart',c:'Creativity',t:'Opposite World',u:`The current direction feels predictable, conventional, or too close to what everyone else would do.`,a:`What would the exact opposite of this idea look like? What becomes more interesting when we reverse the assumptions?`,x:`Write down the opposite version, then borrow one feature, behaviour, or tone from it.`},
{r:'4',s:'heart',c:'Creativity',t:'Random Collision',u:`You want a fresher idea by combining your challenge with an unrelated world.`,a:`Combine [idea] with ideas from [industry, object, ritual, game, film, place, or culture]. Generate 10 hybrid concepts.`,x:`Pick one unlikely combination and describe how it would work in the real world.`},
{r:'5',s:'heart',c:'Creativity',t:'Make It Weirder',u:`The idea is correct but too safe, generic, or forgettable.`,a:`Make this concept stranger, bolder, more specific, and less predictable without making it unusable.`,x:`Push the idea 30% further than comfortable, then bring it back to something people could actually use.`},
{r:'6',s:'heart',c:'Creativity',t:'Make It Simpler',u:`The idea has too many moving parts and needs a cleaner centre.`,a:`Reduce this idea to its simplest possible form. What is the one thing it really does?`,x:`Remove half the features, words, or steps, then ask what still works.`},
{r:'7',s:'heart',c:'Creativity',t:'Change the Medium',u:`You want to escape the default format and imagine the idea in new forms.`,a:`How would this idea work as a poster, app, game, object, performance, ritual, spatial experience, or service?`,x:`Translate the same idea into 3 different mediums and notice what each version reveals.`},
{r:'8',s:'heart',c:'Creativity',t:'Steal the Structure',u:`You have references you like but do not want to copy their surface style.`,a:`Analyse the structure of this reference, then apply its underlying logic to my idea.`,x:`Separate the reference into rhythm, sequence, contrast, reveal, and interaction, then reuse only the structure.`},
{r:'9',s:'heart',c:'Creativity',t:'Emotional Shift',u:`The idea works functionally but the feeling is wrong or undefined.`,a:`Make this feel more playful, calm, premium, urgent, intimate, strange, rebellious, or trustworthy.`,x:`Choose one target emotion and rewrite the concept so every detail supports that feeling.`},
{r:'10',s:'heart',c:'Creativity',t:'Constraint Magic',u:`You need limits that make the work sharper rather than smaller.`,a:`Add 5 strong constraints that would make this idea more interesting, distinctive, or easier to execute.`,x:`Pick one constraint, no screen, no text, no budget, one minute, one gesture, and redesign around it.`},
{r:'J',s:'heart',c:'Creativity',t:'Character Lens',u:`You want to see the idea through a radically different perspective.`,a:`How would a child, artist, scientist, critic, beginner, expert, sceptic, or fan approach this?`,x:`Choose one lens and write a version of the idea that only that person would create.`},
{r:'Q',s:'heart',c:'Creativity',t:'Taste Check',u:`You need a sharper creative judgement before moving forward.`,a:`Critique this for originality, taste, clarity, emotional impact, and memorability.`,x:`Ask AI for the strongest version and the most forgettable version, then compare the difference.`},
{r:'K',s:'heart',c:'Creativity',t:'Signature Move',u:`The idea is useful but does not yet feel ownable or recognisably yours.`,a:`What could make this unmistakably mine? Identify a signature gesture, rule, detail, or point of view.`,x:`Define one repeatable move you could use across the deck, product, artwork, or brand.`},
{r:'A',s:'diamond',c:'Design',t:'User Need',u:`Someone has requested a solution, but the real user need is still unclear.`,a:`What user need might sit underneath this request? Separate stated need, hidden need, emotional need, and business need.`,x:`Rewrite the problem as a human need before proposing any solution.`},
{r:'2',s:'diamond',c:'Design',t:'Assumption Hunt',u:`The concept depends on beliefs that have not been tested yet.`,a:`List the assumptions behind this idea. Rank them by risk and suggest a quick way to test each one.`,x:`Circle the assumption that could kill the idea if wrong, then design one small test.`},
{r:'3',s:'diamond',c:'Design',t:'Journey Map',u:`You need to understand the full experience around one interaction or decision.`,a:`Map the user journey before, during, and after this moment. Include emotions, questions, friction, and opportunities.`,x:`Sketch the journey in 5 steps, then mark where AI could help, stay quiet, or hand back control.`},
{r:'4',s:'diamond',c:'Design',t:'Pain Point Finder',u:`The experience feels okay, but you need to locate the real friction.`,a:`Where would users get confused, frustrated, delayed, anxious, or unsure in this flow?`,x:`Pick the top 3 pain points and rewrite each as a design opportunity.`},
{r:'5',s:'diamond',c:'Design',t:'Interface Pattern',u:`You need to choose the right AI interaction model, not just add a chatbot.`,a:`What AI UX patterns could fit this, copilot, agent, assistant, autocomplete, recommendation, automation, simulation, or critique?`,x:`Choose 2 patterns and compare how each changes user control, effort, trust, and speed.`},
{r:'6',s:'diamond',c:'Design',t:'Human Control',u:`The system could automate too much and make the user feel powerless.`,a:`Where should the user stay in control, review, edit, approve, undo, or override the AI?`,x:`Design one clear moment where the user can say yes, no, not this, or do it differently.`},
{r:'7',s:'diamond',c:'Design',t:'Trust Moment',u:`The user needs confidence before accepting, sharing, buying, or acting.`,a:`Where does the user need proof, explanation, preview, confirmation, or a confidence signal?`,x:`Add one trust-building detail, source, preview, comparison, rationale, or human check.`},
{r:'8',s:'diamond',c:'Design',t:'Failure State',u:`The AI may misunderstand, fail, hallucinate, or produce something weak.`,a:`What happens if the AI misunderstands, fails, gives a poor result, or acts at the wrong time?`,x:`Design the recovery moment, how the user notices the issue, corrects it, and gets back on track.`},
{r:'9',s:'diamond',c:'Design',t:'Memory Boundary',u:`The system could remember useful things, but memory creates privacy and trust issues.`,a:`What should this AI system remember, forget, ask permission for, or never store?`,x:`Create a memory rule, one thing it can remember, one thing it must ask about, one thing it must never keep.`},
{r:'10',s:'diamond',c:'Design',t:'Feedback Loop',u:`The AI output needs to improve through user input.`,a:`How can the user correct, rate, edit, or teach this AI system?`,x:`Design one moment where the user can say, not like that, more like this.`},
{r:'J',s:'diamond',c:'Design',t:'Prototype Fast',u:`You need to move from discussion to evidence quickly.`,a:`Create a lightweight prototype plan I can test in one day for [idea]. Include setup, task, success signal, and learning goal.`,x:`Make the smallest testable version, even if it is fake, manual, or Wizard of Oz.`},
{r:'Q',s:'diamond',c:'Design',t:'Design Critique',u:`The design needs sharper review before more time is spent on execution.`,a:`Critique this design from UX, UI, accessibility, trust, AI behaviour, and business angles.`,x:`Ask for 5 strengths, 5 risks, and 5 specific improvements, then choose the top 3 to act on.`},
{r:'K',s:'diamond',c:'Design',t:'Product Principle',u:`The team needs a clear rule to guide future decisions.`,a:`Turn this idea into 3 product principles that help the team make consistent decisions.`,x:`Write one principle in the format, We do X so users can Y, even when Z.`},
{r:'A',s:'club',c:'Work',t:'Clear Brief',u:`You have messy notes, a vague ask, or too many inputs.`,a:`Turn this messy input into a clear brief with goals, audience, context, constraints, deliverables, and next steps.`,x:`Rewrite the work in one paragraph, then list what is known, unknown, and needed next.`},
{r:'2',s:'club',c:'Work',t:'Meeting Prep',u:`You want to enter a meeting with clarity instead of reacting in the moment.`,a:`Prepare me for this meeting, what matters, what to ask, what to avoid, and what outcome to aim for.`,x:`Write 3 questions, 3 points to make, and 1 decision you want from the meeting.`},
{r:'3',s:'club',c:'Work',t:'Smart Summary',u:`You need to extract signal from notes, documents, or conversations.`,a:`Summarise this into key points, decisions, risks, open questions, and action items.`,x:`Ask AI to separate facts, opinions, decisions, and follow-ups so nothing gets blurred.`},
{r:'4',s:'club',c:'Work',t:'Email Polish',u:`You need to write something clearer, warmer, shorter, or more confident.`,a:`Rewrite this email to be clear, warm, concise, and confident while keeping my intent intact.`,x:`Compare the original and the rewrite, then keep the line that sounds most like you.`},
{r:'5',s:'club',c:'Work',t:'Decision Memo',u:`You need to explain a recommendation, not just share an opinion.`,a:`Turn this into a decision memo with context, options, trade-offs, recommendation, risks, and next steps.`,x:`Force the recommendation into one sentence, then support it with 3 reasons.`},
{r:'6',s:'club',c:'Work',t:'Stakeholder Lens',u:`You need to anticipate how different people will interpret the same idea.`,a:`How would design, product, engineering, leadership, legal, support, and users react to this?`,x:`Create a stakeholder map with what each group cares about, fears, and needs to hear.`},
{r:'7',s:'club',c:'Work',t:'Pushback Prep',u:`You expect objections, doubts, or difficult questions.`,a:`What objections might people raise against this idea, and how should I respond thoughtfully?`,x:`Write the 5 hardest questions, then prepare calm, evidence-based answers.`},
{r:'8',s:'club',c:'Work',t:'Story Spine',u:`You need to make your work persuasive, not just descriptive.`,a:`Turn this project into a compelling story with context, tension, action, learning, and impact.`,x:`Write the story as, There was a problem, we learned, we tried, it changed, the impact was.`},
{r:'9',s:'club',c:'Work',t:'Priority Cut',u:`You have too much to do and need to decide what matters now.`,a:`What should I do first, delay, delegate, simplify, automate, or ignore?`,x:`Sort your tasks into now, next, later, and not worth doing.`},
{r:'10',s:'club',c:'Work',t:'Better Questions',u:`The conversation is stuck because the questions are too shallow.`,a:`Give me 10 sharper questions to ask about this problem, decision, or opportunity.`,x:`Pick the one question that would change the conversation if answered honestly.`},
{r:'J',s:'club',c:'Work',t:'Learning Sprint',u:`You need to learn a topic quickly and practically.`,a:`Create a 7-day learning plan for [topic] with daily exercises, resources, and outputs.`,x:`End each day with one small artifact, a note, sketch, prompt, prototype, or explanation.`},
{r:'Q',s:'club',c:'Work',t:'Tone Match',u:`The content is right, but the voice is wrong.`,a:`Rewrite this in a tone that is warm, sharp, senior, simple, and human.`,x:`Ask for 3 tone options, softer, clearer, stronger, then blend the best parts.`},
{r:'K',s:'club',c:'Work',t:'Leadership Clarity',u:`People need direction, context, and confidence from you.`,a:`Turn this into a clear leadership message that gives context, direction, rationale, and next steps.`,x:`Write the message in 4 parts, what is happening, why it matters, what we will do, what I need from you.`},
{r:'A',s:'spade',c:'Everyday Decisions',t:'What Matters?',u:`You are choosing between options but the real criteria are unclear.`,a:`Help me identify what really matters in this decision, practically, emotionally, financially, and long-term.`,x:`List your top 5 values for this decision, then rank them before comparing options.`},
{r:'2',s:'spade',c:'Everyday Decisions',t:'Compare Options',u:`You need a fair comparison between choices.`,a:`Compare these options across cost, effort, risk, reward, timing, reversibility, and long-term value.`,x:`Create a simple scorecard, then check if the winner also feels right.`},
{r:'3',s:'spade',c:'Everyday Decisions',t:'Future Me',u:`You want to make a decision your future self will respect.`,a:`What would future me be grateful I chose, and what would future me wish I had avoided?`,x:`Write a note from yourself 12 months from now explaining the best decision.`},
{r:'4',s:'spade',c:'Everyday Decisions',t:'Regret Test',u:`You want to avoid the choice that will quietly bother you later.`,a:`Which option am I most likely to regret, and why? What regret is temporary, and what regret is lasting?`,x:`Imagine each option has failed, then write the reason you are disappointed.`},
{r:'5',s:'spade',c:'Everyday Decisions',t:'Hidden Cost',u:`A decision looks attractive, but the second-order costs are unclear.`,a:`What are the hidden costs, maintenance, emotional load, social pressure, time cost, and second-order effects?`,x:`Add a cost column for energy, attention, admin, and future obligations.`},
{r:'6',s:'spade',c:'Everyday Decisions',t:'Small Experiment',u:`You do not need to decide fully yet, you need a way to test.`,a:`What is the smallest experiment I can run before committing to this decision?`,x:`Try the reversible version first, borrow, rent, trial, prototype, ask, or simulate.`},
{r:'7',s:'spade',c:'Everyday Decisions',t:'Risk Map',u:`You need to understand the downside before moving forward.`,a:`Map the risks from minor annoyance to serious problem. Include likelihood, impact, prevention, and recovery.`,x:`Choose the top risk and define what would make you stop, pause, or proceed.`},
{r:'8',s:'spade',c:'Everyday Decisions',t:'Enough Information',u:`You are over-researching and need to know when to stop.`,a:`What information is enough to make a good decision here? What extra research would not change the outcome?`,x:`Set a decision threshold, after I know X and Y, I will choose.`},
{r:'9',s:'spade',c:'Everyday Decisions',t:'Trade-Off Truth',u:`You need to name the real compromise instead of pretending one option has everything.`,a:`What am I gaining, what am I giving up, and what am I pretending not to see?`,x:`Write the trade-off in one honest sentence, I choose X because Y, even though Z.`},
{r:'10',s:'spade',c:'Everyday Decisions',t:'Simplify the Choice',u:`The decision has become too complex to think about clearly.`,a:`Reduce this decision to the 3 most important criteria and ignore the rest for now.`,x:`Remove every factor that is nice to have but not decisive.`},
{r:'J',s:'spade',c:'Everyday Decisions',t:'Ask an Expert',u:`You want multiple forms of advice before choosing.`,a:`Answer this like a designer, financial advisor, therapist, engineer, lawyer, and trusted friend.`,x:`Compare the advice, then ask which perspective is most relevant to your situation.`},
{r:'Q',s:'spade',c:'Everyday Decisions',t:'Emotional Check',u:`Strong feelings are influencing the decision, but you are not sure how.`,a:`Which part of my thinking is fear, desire, ego, pressure, guilt, fatigue, or genuine intuition?`,x:`Name the emotion first, then decide whether it is a warning, a wish, or noise.`},
{r:'K',s:'spade',c:'Everyday Decisions',t:'Final Call',u:`You have enough information and need to choose.`,a:`Give me a clear recommendation, explain why, state the risks, and tell me exactly what to do next.`,x:`Make the decision, define the first action, and set a review point.`}
];
const icons={heart:'♥',diamond:'♦',club:'♣',spade:'♠'};
let filter='all',visible=[...cards],index=0;
const cardEl=document.getElementById('card'),front=document.getElementById('front'),back=document.getElementById('back'),meta=document.getElementById('meta');
function esc(value){return value.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){const d=visible[index];if(!d)return;cardEl.className='card '+d.s;cardEl.classList.remove('flipped');front.className='face front '+d.s;back.className='face backface '+d.s;front.innerHTML=`<div class="corner"><span>${d.r}</span><span class="symbol">${icons[d.s]}</span></div><div class="front-main"><div class="category">${d.c}</div><h2>${esc(d.t)}</h2><div class="hint">Tap to reveal the prompt</div></div><div class="corner bottom"><span>${d.r}</span><span class="symbol">${icons[d.s]}</span></div>`;back.innerHTML=`<div class="back-head"><div><div class="category">${d.c}</div><h2 class="back-title">${esc(d.t)}</h2></div><div class="badge">${d.r}${icons[d.s]}</div></div><div class="sections"><div class="section"><div class="label">Use when</div><p>${esc(d.u)}</p></div><div class="section"><div class="label">Ask AI</div><p class="prompt">“${esc(d.a)}”</p></div><div class="section"><div class="label">Try this</div><p>${esc(d.x)}</p></div></div><button class="copy" type="button">Copy AI prompt</button>`;back.querySelector('.copy').onclick=e=>{e.stopPropagation();navigator.clipboard.writeText(d.a);e.currentTarget.textContent='Copied';setTimeout(()=>e.currentTarget.textContent='Copy AI prompt',1200)};meta.textContent=`${index+1} of ${visible.length} · ${d.r}${icons[d.s]} · ${d.c}`}
function move(n){index=(index+n+visible.length)%visible.length;render()}
function flip(){cardEl.classList.toggle('flipped')}
cardEl.onclick=e=>{if(!e.target.closest('.copy'))flip()};cardEl.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};document.getElementById('flipTop').onclick=flip;document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.getElementById('random').onclick=()=>{let n=index;while(visible.length>1&&n===index)n=Math.floor(Math.random()*visible.length);index=n;render()};
document.querySelectorAll('.filter').forEach(btn=>btn.onclick=()=>{document.querySelector('.filter.active').classList.remove('active');btn.classList.add('active');filter=btn.dataset.filter;visible=filter==='all'?[...cards]:cards.filter(c=>c.s===filter);index=0;render()});
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();flip()}});render();
</script>
</body>
</html>
