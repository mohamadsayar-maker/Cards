<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea">
<title>Think With AI</title>
<style>
html,body{height:100%;margin:0;background:#f4f1ea;color:#11110f;font:16px/1.5 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.loading{height:100%;display:grid;place-items:center;text-align:center;padding:24px}.loading small{display:block;color:#77736b;margin-top:8px;max-width:440px}
</style>
</head>
<body>
<div class="loading" id="loading">Loading Think With AI…<small>Preparing the original card experience with the new 52-card content.</small></div>
<script>
(async()=>{
  const originalUrl='./card2.html';
  const contentUrl='./ai-cards.js';

  function scanArray(source,start){
    let depth=0,quote='',escaped=false,lineComment=false,blockComment=false;
    for(let i=start;i<source.length;i++){
      const ch=source[i],next=source[i+1];
      if(lineComment){if(ch==='\n')lineComment=false;continue}
      if(blockComment){if(ch==='*'&&next==='/'){blockComment=false;i++}continue}
      if(quote){
        if(escaped){escaped=false;continue}
        if(ch==='\\'){escaped=true;continue}
        if(ch===quote)quote='';
        continue;
      }
      if(ch==='/'&&next==='/'){lineComment=true;i++;continue}
      if(ch==='/'&&next==='*'){blockComment=true;i++;continue}
      if(ch==='"'||ch==="'"||ch==='`'){quote=ch;continue}
      if(ch==='[')depth++;
      else if(ch===']'){
        depth--;
        if(depth===0)return i;
      }
    }
    return -1;
  }

  function findCardArray(html){
    const declaration=/\b(?:const|let|var)\s+([A-Za-z_$][\w$]*)\s*=\s*/g;
    const candidates=[];
    let match;
    while((match=declaration.exec(html))){
      const start=declaration.lastIndex;
      if(html[start]!=='[')continue;
      const end=scanArray(html,start);
      if(end<0)continue;
      const arraySource=html.slice(start,end+1);
      try{
        const value=Function('"use strict";return ('+arraySource+');')();
        if(!Array.isArray(value)||value.length<20||!value.every(item=>item&&typeof item==='object'&&!Array.isArray(item)))continue;
        const keys=Object.keys(value[0]||{});
        const stringCount=keys.filter(key=>typeof value[0][key]==='string').length;
        if(stringCount<2)continue;
        let score=value.length;
        if(/card|deck|note/i.test(match[1]))score+=80;
        if(keys.some(key=>/title|name|heading/i.test(key)))score+=50;
        if(keys.some(key=>/meaning|description|prompt|question|action/i.test(key)))score+=50;
        candidates.push({name:match[1],start,end,value,score});
      }catch(error){}
    }
    candidates.sort((a,b)=>b.score-a.score);
    return candidates[0]||null;
  }

  function chooseKeys(items){
    const keys=[...new Set(items.slice(0,Math.min(items.length,12)).flatMap(Object.keys))];
    const averages=new Map(keys.map(key=>{
      const values=items.slice(0,Math.min(items.length,12)).map(item=>item[key]).filter(value=>typeof value==='string');
      return [key,values.length?values.reduce((sum,value)=>sum+value.length,0)/values.length:Infinity];
    }));
    const stringKeys=keys.filter(key=>Number.isFinite(averages.get(key))).sort((a,b)=>averages.get(a)-averages.get(b));
    const pick=regex=>keys.find(key=>regex.test(key));
    const title=pick(/^(title|name|heading|label)$/i)||pick(/title|name|heading/i)||stringKeys[0];
    const category=pick(/category|group|section|type/i);
    const prompt=pick(/prompt|question|action|tip|instruction|exercise/i);
    const meaning=pick(/meaning|description|definition|summary|body|text|detail/i)||stringKeys.filter(key=>key!==title&&key!==category&&key!==prompt).sort((a,b)=>averages.get(b)-averages.get(a))[0];
    const fallbackPrompt=prompt||stringKeys.filter(key=>key!==title&&key!==category&&key!==meaning).sort((a,b)=>averages.get(b)-averages.get(a))[0];
    const id=keys.find(key=>/^(id|number|index|order|cardNumber|cardNo)$/i.test(key))||keys.find(key=>typeof items[0][key]==='number');
    const rank=pick(/^rank$|cardRank/i);
    const suit=pick(/^suit$|cardSuit/i);
    return {title,category,meaning,prompt:fallbackPrompt,id,rank,suit};
  }

  try{
    const [originalResponse,contentResponse]=await Promise.all([
      fetch(originalUrl,{cache:'no-store'}),
      fetch(contentUrl,{cache:'no-store'})
    ]);
    if(!originalResponse.ok)throw new Error('Could not load the original deck');
    if(!contentResponse.ok)throw new Error('Could not load the new card content');

    let engine=await originalResponse.text();
    const contentSource=await contentResponse.text();
    const cardsStart=contentSource.indexOf('const aiCards=');
    const cardsEnd=contentSource.lastIndexOf(']');
    if(cardsStart<0||cardsEnd<0)throw new Error('Could not read the 52-card content');
    const sourceCards=Function('"use strict";return ('+contentSource.slice(cardsStart+'const aiCards='.length,cardsEnd+1)+');')();
    if(!Array.isArray(sourceCards)||sourceCards.length!==52)throw new Error('The new deck does not contain 52 cards');

    const target=findCardArray(engine);
    if(!target)throw new Error('Could not locate the original deck content');
    const keys=chooseKeys(target.value);
    if(!keys.title)throw new Error('Could not identify the original card title field');

    const mapped=sourceCards.map((sourceCard,index)=>{
      const card={...target.value[index%target.value.length]};
      if(keys.id)card[keys.id]=index+1;
      card[keys.title]=sourceCard.t;
      if(keys.category)card[keys.category]=sourceCard.c;
      if(keys.meaning)card[keys.meaning]='Use when: '+sourceCard.u;
      if(keys.prompt)card[keys.prompt]='Ask AI: “'+sourceCard.a+'”\n\nTry this: '+sourceCard.x;
      if(keys.rank)card[keys.rank]=sourceCard.r;
      if(keys.suit)card[keys.suit]=sourceCard.s;
      return card;
    });

    engine=engine.slice(0,target.start)+JSON.stringify(mapped)+engine.slice(target.end+1);
    engine=engine.replaceAll('Mental Notes','Think With AI');
    engine=engine.replaceAll('53 cards','52 cards');
    document.open();
    document.write(engine);
    document.close();
  }catch(error){
    console.error(error);
    document.getElementById('loading').innerHTML='The Think With AI deck could not load.<small>'+String(error.message||error)+'. Please refresh the page.</small>';
  }
})();
</script>
</body>
</html>
