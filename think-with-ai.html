<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea">
<title>Think With AI</title>
<style>
html,body{height:100%;margin:0;background:#f4f1ea;color:#11110f;font:16px/1.5 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.loading{height:100%;display:grid;place-items:center;text-align:center;padding:24px}.loading small{display:block;color:#77736b;margin-top:8px;max-width:420px}
</style>
</head>
<body>
<div class="loading" id="loading">Loading Think With AI…<small>The original card engine is being prepared with the new 52-card content.</small></div>
<script>
(async()=>{
  const engineUrl='card2.html';
  const contentUrl='https://raw.githubusercontent.com/mohamadsayar-maker/Cards/83a5ccb547ec704c4ad6af72d08a406b34c675e3/think-with-ai.html';

  try{
    const [engineResponse,contentResponse]=await Promise.all([
      fetch(engineUrl,{cache:'no-store'}),
      fetch(contentUrl,{cache:'force-cache'})
    ]);
    if(!engineResponse.ok) throw new Error('Could not load the original deck engine');
    if(!contentResponse.ok) throw new Error('Could not load the Think With AI cards');

    let engine=await engineResponse.text();
    const contentSource=await contentResponse.text();

    const cardsStart=contentSource.indexOf('const cards=[');
    const cardsEnd=contentSource.indexOf('];\nconst icons=',cardsStart);
    if(cardsStart<0||cardsEnd<0) throw new Error('Could not read the Think With AI card data');

    const arraySource=contentSource.slice(cardsStart+'const cards='.length,cardsEnd+1);
    const sourceCards=Function('"use strict";return ('+arraySource+');')();
    if(!Array.isArray(sourceCards)||sourceCards.length!==52) throw new Error('The Think With AI deck did not contain 52 cards');

    const cards=sourceCards.map((card,index)=>({
      id:index+1,
      title:card.t,
      meaning:'Use when: '+card.u,
      prompt:'Ask AI:\n“'+card.a+'”\n\nTry this:\n'+card.x,
      category:card.c,
      rank:card.r,
      suit:card.s
    }));

    const engineCardsStart=engine.indexOf('const cards=');
    const engineCardsEnd=engine.indexOf('\n\nconst app=',engineCardsStart);
    if(engineCardsStart<0||engineCardsEnd<0) throw new Error('Could not prepare the original deck engine');

    engine=engine.slice(0,engineCardsStart)+'const cards='+JSON.stringify(cards)+';'+engine.slice(engineCardsEnd);
    engine=engine
      .replace('<title>Mental Notes, Card 2</title>','<title>Think With AI</title>')
      .replace('<div class="brand">Mental Notes</div>','<div class="brand">Think With AI</div>')
      .replace('aria-label="Mental Notes card deck"','aria-label="Think With AI card deck"')
      .replace('<h2>Card 2 controls</h2>','<h2>Think With AI controls</h2>')
      .replace('<div class="type">Behavioural Design</div>','<div class="type">${card.category}</div>')
      .replace('<body>','<body class="aiDeck">')
      .replace('</style>',`.aiDeck .meaning{font-size:.94rem;line-height:1.34}.aiDeck .prompt{font-size:.78rem;line-height:1.34;white-space:pre-line;overflow:auto;scrollbar-width:thin}.aiDeck .prompt::-webkit-scrollbar{width:4px}.aiDeck .prompt::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px}</style>`);

    document.open();
    document.write(engine);
    document.close();
  }catch(error){
    console.error(error);
    document.getElementById('loading').innerHTML='The Think With AI deck could not load.<small>'+String(error.message||error)+'. Please refresh the page.</small>';
  }
})();
</script>
</body>
</html>
