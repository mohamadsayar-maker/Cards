<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1ea">
<title>Choose a Card Deck</title>
<style>
:root{color-scheme:light;--bg:#f4f1ea;--ink:#11110f;--muted:#77736b;--card:#fffef9;--card2:#ebe6da;--line:rgba(24,22,18,.12);--shadow:0 34px 90px rgba(42,34,20,.16)}
:root[data-theme="dark"]{color-scheme:dark;--bg:#151511;--ink:#fbfaf5;--muted:#aaa59b;--card:#25241f;--card2:#201f1b;--line:rgba(255,255,255,.13);--shadow:0 36px 92px rgba(0,0,0,.42)}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.page{position:relative;min-height:100%;display:grid;place-items:center;padding:max(28px,env(safe-area-inset-top)) clamp(18px,4vw,56px) max(28px,env(safe-area-inset-bottom))}
.theme{position:absolute;z-index:20;top:calc(16px + env(safe-area-inset-top));right:max(18px,env(safe-area-inset-right));width:34px;height:34px;display:grid;place-items:center;border-radius:999px;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 86%,transparent);box-shadow:0 14px 36px rgba(42,34,20,.10);color:var(--ink);cursor:pointer}
.themeIcon{position:relative;width:15px;height:15px;border:2px solid currentColor;border-radius:999px;overflow:hidden;transition:transform .42s cubic-bezier(.2,.8,.2,1)}.themeIcon:before{content:"";position:absolute;inset:0 50% 0 0;background:currentColor}:root[data-theme="dark"] .themeIcon{transform:rotate(180deg)}
.content{width:min(1040px,100%)}header{text-align:center;margin-bottom:clamp(30px,6vh,64px)}.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}h1{font-size:clamp(42px,8vw,84px);line-height:.94;letter-spacing:-.06em;margin:14px 0 0}
.preview{margin:0 0 clamp(24px,4vw,42px)}.preview-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.preview-label{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}.preview-controls{display:flex;gap:6px}.preview-controls button{width:30px;height:30px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer}.preview-controls button:hover,.preview-controls button:focus-visible{border-color:color-mix(in srgb,var(--ink) 45%,var(--line));outline:none}.preview-viewport{overflow:hidden;border-radius:22px}.preview-track{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 12px;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:thin}.preview-track::-webkit-scrollbar{height:6px}.preview-track::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px}.placeholder-card{position:relative;flex:0 0 clamp(150px,22vw,210px);height:clamp(190px,26vw,260px);padding:18px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,var(--card),var(--card2));box-shadow:0 14px 30px rgba(42,34,20,.08);scroll-snap-align:start;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}.placeholder-card:after{content:"";position:absolute;width:130px;height:170px;right:-44px;bottom:-66px;border:1px solid var(--line);border-radius:18px;transform:rotate(18deg);background:color-mix(in srgb,var(--card) 70%,transparent)}.placeholder-kicker,.placeholder-number{position:relative;z-index:1;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}.placeholder-mark{position:relative;z-index:1;width:32px;height:32px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:12px}.placeholder-line{position:relative;z-index:1;width:72%;height:8px;border-radius:99px;background:color-mix(in srgb,var(--ink) 16%,transparent)}
.preview{display:none}
.decks{display:flex;gap:clamp(14px,2vw,24px);overflow-x:auto;padding:2px 2px 12px;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;touch-action:pan-x;cursor:grab}.decks.dragging{cursor:grabbing;scroll-snap-type:none;scroll-behavior:auto}.decks::-webkit-scrollbar{display:none}
.decks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));overflow:visible;padding:0;scroll-snap-type:none;touch-action:auto;cursor:default}
.decks>.deck,.decks>.placeholder-card{flex:0 0 calc((100% - 24px)/2);scroll-snap-align:start}
.deck{position:relative;min-height:330px;padding:clamp(24px,4vw,44px);border-radius:30px;text-decoration:none;color:inherit;overflow:hidden;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;transition:transform .35s cubic-bezier(.2,.7,.2,1),border-color .25s,box-shadow .35s}
.deck:hover,.deck:focus-visible{transform:translateY(-7px);border-color:color-mix(in srgb,var(--ink) 45%,var(--line));box-shadow:var(--shadow);outline:none}
.deck h2{position:relative;z-index:2;font-size:clamp(38px,5vw,62px);line-height:.92;letter-spacing:-.06em;margin:0;max-width:82%;transition:transform .5s cubic-bezier(.16,1,.3,1)}
.placeholder-card{flex-basis:calc((100% - 24px)/2);min-height:330px;padding:clamp(24px,4vw,44px);border-radius:30px;background:var(--card)}.placeholder-card:after{z-index:3;width:235px;height:325px;right:-30px;bottom:-104px;border-radius:24px;background:linear-gradient(155deg,color-mix(in srgb,var(--card) 95%,white),var(--card2));box-shadow:-18px 24px 50px rgba(0,0,0,.16)}.placeholder-card:nth-child(odd):after{right:-42px;bottom:-96px;transform:rotate(-14deg)}
.deck-title{position:relative;z-index:auto;display:flex;align-items:center;justify-content:center;gap:12px;width:100%;max-width:100%;text-align:center;transition:transform .5s cubic-bezier(.16,1,.3,1)}.deck-title h2{max-width:none;white-space:nowrap;font-size:clamp(26px,3.4vw,48px)}
.deck-info{position:relative;z-index:5;width:30px;height:30px;display:grid;place-items:center;flex:0 0 auto;margin:0;border:1px solid var(--line);border-radius:999px;background:color-mix(in srgb,var(--card) 86%,transparent);color:var(--muted);font-size:.82rem;font-weight:750;cursor:pointer}.deck-info:hover,.deck-info:focus-visible{border-color:color-mix(in srgb,var(--ink) 45%,var(--line));color:var(--ink);outline:none}
.deck-placeholder{cursor:default;pointer-events:none}
.deck:after{content:"";position:absolute;z-index:3;width:235px;height:325px;border-radius:24px;right:-30px;bottom:-104px;transform:rotate(15deg);border:1px solid var(--line);background:linear-gradient(155deg,color-mix(in srgb,var(--card) 95%,white),var(--card2));box-shadow:-18px 24px 50px rgba(0,0,0,.16);transition:transform .6s cubic-bezier(.16,1,.3,1),right .6s cubic-bezier(.16,1,.3,1),bottom .6s cubic-bezier(.16,1,.3,1)}
.deck:first-child:after{transform:rotate(-14deg);right:-42px;bottom:-96px}
.deck:hover:after,.deck:focus-visible:after{right:-122px;bottom:-168px;transform:rotate(24deg)}
.deck:first-child:hover:after,.deck:first-child:focus-visible:after{right:-130px;bottom:-170px;transform:rotate(-25deg)}
.deck:hover h2,.deck:focus-visible h2{transform:translateX(4px)}
.deck:hover .deck-title,.deck:focus-visible .deck-title{transform:translateX(4px)}
.deck:hover:after,.deck:focus-visible:after{right:-260px;bottom:-245px;transform:rotate(24deg)}.deck:first-child:hover:after,.deck:first-child:focus-visible:after{right:-270px;bottom:-245px;transform:rotate(-25deg)}
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:24px;background:rgba(17,16,13,.48);opacity:0;pointer-events:none;transition:opacity .2s ease}.modal.open{opacity:1;pointer-events:auto}.modal-card{width:min(520px,100%);padding:28px;border:1px solid var(--line);border-radius:24px;background:var(--card);box-shadow:var(--shadow);transform:translateY(10px);transition:transform .25s ease}.modal.open .modal-card{transform:none}.modal-card h2{margin:0 0 12px;font-size:1.5rem;letter-spacing:-.04em}.modal-card p{margin:0;color:var(--muted);line-height:1.55}.modal-close{float:right;width:30px;height:30px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);font-size:1.1rem;cursor:pointer}.modal-close:focus-visible{outline:2px solid currentColor;outline-offset:2px}
@media(max-width:720px){.page{align-items:start}.content{padding-top:8vh}.decks{grid-template-columns:1fr}.deck{min-height:245px;border-radius:24px}.deck:after{width:190px;height:265px;right:-28px;bottom:-90px}.deck h2{max-width:78%}header{margin-bottom:30px}}
@media(max-width:720px){.placeholder-card{flex-basis:100%;min-height:245px;border-radius:24px}.placeholder-card:after{width:190px;height:265px;right:-28px;bottom:-90px}.preview-track{gap:14px}}
@media(max-width:720px){.decks>.deck{flex-basis:100%}}
@media(max-width:720px){.deck:hover:after,.deck:focus-visible:after{right:-190px;bottom:-205px}.deck:first-child:hover:after,.deck:first-child:focus-visible:after{right:-200px;bottom:-205px}}
@media(prefers-reduced-motion:reduce){.deck,.deck:after,.deck h2,.themeIcon{transition:none}}
</style>
</head>
<body>
<main class="page">
<button class="theme" id="theme" aria-label="Toggle theme"><span class="themeIcon" aria-hidden="true"></span></button>
<div class="content"><header><div class="eyebrow">Interactive thinking tools</div><h1>Choose your deck</h1></header>
<section class="preview" aria-labelledby="previewLabel"><div class="preview-head"><div class="preview-label" id="previewLabel">A glimpse inside</div><div class="preview-controls"><button type="button" id="previewPrev" aria-label="Show previous placeholder cards">←</button><button type="button" id="previewNext" aria-label="Show next placeholder cards">→</button></div></div><div class="preview-viewport"><div class="preview-track" id="previewTrack"><article class="placeholder-card"><span class="placeholder-kicker">Placeholder</span><span class="placeholder-mark">✦</span><span class="placeholder-line"></span><span class="placeholder-number">01</span></article><article class="placeholder-card"><span class="placeholder-kicker">Placeholder</span><span class="placeholder-mark">○</span><span class="placeholder-line"></span><span class="placeholder-number">02</span></article><article class="placeholder-card"><span class="placeholder-kicker">Placeholder</span><span class="placeholder-mark">✳</span><span class="placeholder-line"></span><span class="placeholder-number">03</span></article><article class="placeholder-card"><span class="placeholder-kicker">Placeholder</span><span class="placeholder-mark">△</span><span class="placeholder-line"></span><span class="placeholder-number">04</span></article><article class="placeholder-card"><span class="placeholder-kicker">Placeholder</span><span class="placeholder-mark">□</span><span class="placeholder-line"></span><span class="placeholder-number">05</span></article><article class="placeholder-card"><span class="placeholder-kicker">Placeholder</span><span class="placeholder-mark">+</span><span class="placeholder-line"></span><span class="placeholder-number">06</span></article></div></div></section>
<section class="decks"><a class="deck" href="classic.html"><div class="deck-title"><h2>Mental Notes</h2><button class="deck-info" type="button" aria-label="About Mental Notes" data-info="mental">i</button></div></a><a class="deck" href="think-with-ai.html?v=f53687f"><div class="deck-title"><h2>Think With AI</h2><button class="deck-info" type="button" aria-label="About Think With AI" data-info="ai">i</button></div></a><a class="deck" href="ai-design-mastery.html"><div class="deck-title"><h2>AI Design Mastery</h2><button class="deck-info" type="button" aria-label="About AI Product Design Mastery" data-info="aiDesign">i</button></div></a><a class="deck" href="macro-lens.html"><div class="deck-title"><h2>Macro Lens</h2><button class="deck-info" type="button" aria-label="About Macro Lens" data-info="macroLens">i</button></div></a></section>
</div></main>
<div class="modal" id="infoModal" role="dialog" aria-modal="true" aria-labelledby="infoTitle" aria-describedby="infoBody"><div class="modal-card"><button class="modal-close" id="modalClose" type="button" aria-label="Close information">×</button><h2 id="infoTitle"></h2><p id="infoBody"></p></div></div>
<script>
const root=document.documentElement;
const saved=localStorage.getItem("cardsTheme")||localStorage.getItem("card2Theme")||localStorage.getItem("theme");
if(saved)root.dataset.theme=saved;
function saveTheme(next){root.dataset.theme=next;["card2Theme","cardsTheme","theme"].forEach(k=>localStorage.setItem(k,next))}
document.getElementById("theme").addEventListener("click",()=>saveTheme(root.dataset.theme==="dark"?"light":"dark"));
const infoModal=document.getElementById("infoModal");
const infoTitle=document.getElementById("infoTitle");
const infoBody=document.getElementById("infoBody");
const infoContent={mental:{title:"Mental Notes",body:"A 53-card collection of behavioural design and psychology principles. Each card pairs a principle with a plain-language explanation and an action-oriented prompt. The content is bundled locally in this project and does not require a live AI connection."},ai:{title:"Think With AI",body:"A 52-card collection of structured prompts for using AI in creative work, problem solving and everyday decisions. The content is bundled locally in this project and is designed to help you think with AI—not to generate responses automatically."},aiDesign:{title:"AI Product Design Mastery",body:"A 53-card practical course for product designers covering model behaviour, context, agents, tools, evaluations, safety and autonomy. The content comes from the AI Product Design Mastery document and is bundled locally with this project."},macroLens:{title:"Macro Lens",body:"A 141-card technology learning deck covering storage, processors, displays, software, security, networking, power and computing history. The content comes from the supplied Macro Lens 141-card document and is bundled locally with this project."}};
function closeInfo(){infoModal.classList.remove("open");}
document.querySelectorAll(".deck-info").forEach(button=>button.addEventListener("click",event=>{event.preventDefault();event.stopPropagation();const content=infoContent[button.dataset.info];infoTitle.textContent=content.title;infoBody.textContent=content.body;infoModal.classList.add("open");document.getElementById("modalClose").focus();}));
document.getElementById("modalClose").addEventListener("click",closeInfo);
infoModal.addEventListener("click",event=>{if(event.target===infoModal)closeInfo();});
window.addEventListener("keydown",event=>{if(event.key==="Escape")closeInfo();});
const previewTrack=document.getElementById("previewTrack");
document.getElementById("previewPrev").addEventListener("click",()=>previewTrack.scrollBy({left:-previewTrack.clientWidth*.72,behavior:"smooth"}));
document.getElementById("previewNext").addEventListener("click",()=>previewTrack.scrollBy({left:previewTrack.clientWidth*.72,behavior:"smooth"}));
</script>
</body></html>
