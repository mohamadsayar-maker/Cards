<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Apple HIG Deck</title>
</head>
<body>
<script>
// Reuse the exact card markup, layout, flip mechanics, animation, sound and
// settings from card2.html. Only the deck's content and title are different.
(async () => {
  try {
    const response = await fetch('card2.html');
    if (!response.ok) throw new Error(`Shared deck returned ${response.status}`);
    let html = await response.text();
    const scripts = '<script src="macro-lens-cards.js"><\/script>';
    const branch = "}:deckKey==='macro-lens'?{";
    if (!html.includes(scripts) || !html.includes(branch)) {
      throw new Error('Shared deck structure has changed');
    }
    html = html.replace(scripts, '<script src="apple-hig-cards.js"><\/script>\n' + scripts);
    html = html.replace(branch, `}:deckKey==='apple-hig'?{
  title:'Apple HIG',
  cards:window.appleHIGCards.map((card,index)=>({...card,id:index+1}))
` + branch);
    history.replaceState(null, '', 'apple-hig.html?deck=apple-hig');
    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    document.body.textContent = 'Could not load the shared card deck. Please refresh the page.';
    console.error('Apple HIG deck:', error);
  }
})();
</script>
</body>
</html>
